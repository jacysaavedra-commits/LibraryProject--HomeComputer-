<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AC Library</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <div class="logo-wrap">
                <img src="{% static 'images/images.jpg' %}" alt="logo" class="logo-img">
            </div>
            <nav class="main-nav">
                <a href="{% url 'home' %}">Home</a>
                <a href="{% url 'book_list' %}">Books</a>
                <a href="{% url 'authors' %}">Authors</a>
            </nav>
            <div class="auth-wrap">
                {% if request.session.customer_id %}
                    <a class="profile-button" href="{% url 'profile' %}" aria-label="Account">
                        <span class="profile-initial">{{ request.session.customer_name|default:'U'|slice:":1"|upper }}</span>
                    </a>
                {% else %}
                    <a class="btn btn-login" href="{% url 'login' %}">Login</a>
                    <a class="btn btn-admin" href="/admin/">Admin</a>
                {% endif %}
            </div>
        </div>
    </header>

    <main class="site-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer" style="position:fixed; left:50%; transform:translateX(-50%); bottom:16px; width:auto; text-align:center; z-index:9999; pointer-events:none;">
        <p style="margin:0; padding:6px 10px; pointer-events:auto;">&copy; AC Library 2026</p>
    </footer>
</body>
</html>
